<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- URL del backend en Render. En local se ignora: la página usa el mismo servidor. -->
  <meta name="api-base" content="https://descargador-api-p6fk.onrender.com">
  <title>Descargador de videos</title>
  <style>
    :root {
      color-scheme: light dark;
      --acento: #6c5ce7;
      --fondo: #f5f5fa;
      --tarjeta: #ffffff;
      --texto: #1d1d27;
      --borde: #d0d0d8;
      --error: #d63031;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fondo: #15151d;
        --tarjeta: #21212c;
        --texto: #f0f0f5;
        --borde: #3a3a4a;
      }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
      background: var(--fondo);
      color: var(--texto);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { width: 100%; max-width: 560px; }
    h1 { font-size: 1.5rem; margin: 8px 0 4px; }
    .subtitulo { margin: 0 0 20px; opacity: .7; font-size: .95rem; }
    .tarjeta {
      background: var(--tarjeta);
      border: 1px solid var(--borde);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
    }
    .fila { display: flex; gap: 8px; }
    input[type=text], select {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--borde);
      background: transparent;
      color: inherit;
      font: inherit;
    }
    input[type=text] { flex: 1; min-width: 0; }
    button {
      padding: 12px 16px;
      border: 0;
      border-radius: 10px;
      background: var(--acento);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: wait; }
    button.secundario { background: transparent; color: var(--acento); border: 1px solid var(--acento); }
    .error { color: var(--error); margin: 12px 0 0; font-size: .95rem; }
    .estado { opacity: .75; margin: 12px 0 0; font-size: .95rem; }
    .info { display: flex; gap: 14px; align-items: flex-start; }
    .info img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 10px;
      background: var(--borde);
      flex-shrink: 0;
    }
    .info h2 { font-size: 1rem; margin: 0 0 6px; word-break: break-word; }
    .info p { margin: 0; opacity: .7; font-size: .9rem; }
    .opciones { display: grid; gap: 6px; margin-top: 16px; }
    .opciones label { font-size: .9rem; opacity: .8; }
    .botones { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .pie { font-size: .8rem; opacity: .6; text-align: center; margin-top: 24px; line-height: 1.4; }
    @media (max-width: 480px) {
      .botones { grid-template-columns: 1fr; }
      .info img { width: 90px; height: 90px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Descargador de videos</h1>
    <p class="subtitulo">Pegá un link de X/Twitter, Instagram Reels, TikTok o YouTube.</p>

    <section class="tarjeta">
      <form id="formulario" class="fila">
        <input id="url" type="text" placeholder="https://www.tiktok.com/@usuario/video/..." autocomplete="off" required>
        <button id="buscar" type="submit">Buscar</button>
      </form>
      <p id="error" class="error" hidden></p>
      <p id="estado" class="estado" hidden></p>
    </section>

    <section id="resultado" class="tarjeta" hidden>
      <div class="info">
        <img id="miniatura" alt="" referrerpolicy="no-referrer" hidden>
        <div>
          <h2 id="titulo"></h2>
          <p id="meta"></p>
        </div>
      </div>
      <div class="opciones">
        <label for="calidad">Calidad del video</label>
        <select id="calidad"></select>
      </div>
      <div class="botones">
        <button id="btn-video" type="button">Descargar video (MP4)</button>
        <button id="btn-audio" type="button" class="secundario">Solo audio (MP3)</button>
      </div>
    </section>

    <p class="pie">
      Usá esta herramienta solo con contenido tuyo o que tengas permiso para descargar.
      Respetá los derechos de autor y los términos de cada plataforma.
    </p>
  </main>

  <script>
    (() => {
      const $ = (id) => document.getElementById(id);
      // En local, la página y la API están en el mismo servidor. Publicada, la API está en la meta.
      const esLocal = ["localhost", "127.0.0.1"].includes(location.hostname);
      const API_BASE = esLocal
        ? ""
        : document.querySelector('meta[name="api-base"]').content.replace(/\/+$/, "");
      const formulario = $("formulario");
      const campoUrl = $("url");
      const botonBuscar = $("buscar");
      const errorEl = $("error");
      const estadoEl = $("estado");
      const resultado = $("resultado");
      const miniatura = $("miniatura");
      const titulo = $("titulo");
      const meta = $("meta");
      const calidad = $("calidad");
      const btnVideo = $("btn-video");
      const btnAudio = $("btn-audio");
      const botones = [botonBuscar, btnVideo, btnAudio];

      let urlActual = "";

      function mostrarError(texto) {
        errorEl.textContent = texto || "";
        errorEl.hidden = !texto;
      }

      function mostrarEstado(texto) {
        estadoEl.textContent = texto || "";
        estadoEl.hidden = !texto;
      }

      function ocupado(activo) {
        botones.forEach((b) => (b.disabled = activo));
      }

      function formatearDuracion(segundos) {
        if (!segundos) return "";
        const minutos = Math.floor(segundos / 60);
        const resto = Math.round(segundos % 60);
        return `${minutos}:${String(resto).padStart(2, "0")}`;
      }

      function nombreDesdeCabecera(cabecera) {
        if (!cabecera) return null;
        const coincidencia =
          /filename\*=UTF-8''([^;]+)/i.exec(cabecera) ||
          /filename="?([^";]+)"?/i.exec(cabecera);
        if (!coincidencia) return null;
        try {
          return decodeURIComponent(coincidencia[1]);
        } catch {
          return coincidencia[1];
        }
      }

      async function leerError(respuesta) {
        try {
          const datos = await respuesta.json();
          return datos.error || null;
        } catch {
          return null;
        }
      }

      // Si el navegador no recibe respuesta (backend apagado, dormido o bloqueado por CORS),
      // fetch rechaza con un TypeError genérico ("Load failed" en Safari). Lo cambiamos por un mensaje útil.
      async function pedirAlServidor(ruta, cuerpo) {
        try {
          return await fetch(`${API_BASE}${ruta}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(cuerpo),
          });
        } catch {
          throw new Error(
            "No pude conectar con el servidor. Revisá que el backend de Render esté activo " +
              "(puede tardar un minuto si estaba dormido) y volvé a intentar."
          );
        }
      }

      function llenarCalidades(alturas) {
        calidad.replaceChildren();
        calidad.add(new Option("Mejor calidad disponible", "mejor"));
        alturas.forEach((h) => calidad.add(new Option(`${h}p`, String(h))));
        calidad.disabled = alturas.length === 0;
      }

      function mostrarResultado(datos) {
        titulo.textContent = datos.titulo;
        meta.textContent = [datos.autor, formatearDuracion(datos.duracion)]
          .filter(Boolean)
          .join(" · ");

        if (datos.miniatura && /^https?:\/\//.test(datos.miniatura)) {
          miniatura.src = datos.miniatura;
          miniatura.hidden = false;
        } else {
          miniatura.removeAttribute("src");
          miniatura.hidden = true;
        }

        llenarCalidades(datos.alturas || []);
        resultado.hidden = false;
      }

      formulario.addEventListener("submit", async (evento) => {
        evento.preventDefault();
        let url = campoUrl.value.trim();
        if (url && !/^https?:\/\//i.test(url)) url = "https://" + url;

        mostrarError("");
        mostrarEstado("Buscando el video…");
        resultado.hidden = true;
        ocupado(true);

        try {
          const respuesta = await pedirAlServidor("/api/info", { url });
          if (!respuesta.ok) {
            throw new Error((await leerError(respuesta)) || "No se pudo leer el link.");
          }
          const datos = await respuesta.json();
          urlActual = url;
          mostrarEstado("");
          mostrarResultado(datos);
        } catch (err) {
          mostrarEstado("");
          mostrarError(err.message || "No se pudo conectar con el servidor.");
        } finally {
          ocupado(false);
        }
      });

      async function descargar(tipo) {
        mostrarError("");
        ocupado(true);
        mostrarEstado(
          tipo === "audio"
            ? "Preparando el audio… puede tardar un poco."
            : "Descargando el video… puede tardar un poco."
        );

        try {
          const respuesta = await pedirAlServidor("/api/descargar", {
            url: urlActual,
            tipo,
            altura: calidad.value,
          });
          if (!respuesta.ok) {
            throw new Error((await leerError(respuesta)) || "No se pudo descargar el archivo.");
          }

          const blob = await respuesta.blob();
          const nombre =
            nombreDesdeCabecera(respuesta.headers.get("Content-Disposition")) ||
            (tipo === "audio" ? "audio.mp3" : "video.mp4");

          const objeto = URL.createObjectURL(blob);
          const enlace = document.createElement("a");
          enlace.href = objeto;
          enlace.download = nombre;
          document.body.appendChild(enlace);
          enlace.click();
          enlace.remove();
          setTimeout(() => URL.revokeObjectURL(objeto), 60000);

          mostrarEstado("Listo: el archivo se está guardando.");
        } catch (err) {
          mostrarEstado("");
          mostrarError(err.message || "No se pudo descargar el archivo.");
        } finally {
          ocupado(false);
        }
      }

      btnVideo.addEventListener("click", () => descargar("video"));
      btnAudio.addEventListener("click", () => descargar("audio"));
    })();
  </script>
</body>
</html>
